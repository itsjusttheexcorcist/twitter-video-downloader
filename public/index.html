<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111111">

  <title>X Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .description {
      color: #aaa;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .box {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 18px;
      color: #aaa;
      min-height: 24px;
    }

    .tip {
      margin-top: 25px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">𝕏</div>

    <h1>X Video Downloader</h1>

    <p class="description">
      Paste a public X/Twitter post containing a video.
    </p>

    <div class="box">

      <input
        id="url"
        type="url"
        placeholder="Paste X/Twitter link here"
        autocomplete="off"
      >

      <button id="download">
        Download Video
      </button>

      <div id="status"></div>

    </div>

    <div class="tip">
      Only download videos you have permission to save or use.
    </div>

  </main>

<script>
const input = document.getElementById("url");
const button = document.getElementById("download");
const status = document.getElementById("status");

button.addEventListener("click", async () => {

  const url = input.value.trim();

  if (!url) {
    status.textContent = "Paste an X/Twitter link first.";
    return;
  }

  button.disabled = true;
  status.textContent = "Downloading video…";

  try {

    const response = await fetch("/api/download", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    if (!response.ok) {
      let message = "Could not download the video.";

      try {
        const data = await response.json();
        if (data.error) message = data.error;
      } catch {}

      throw new Error(message);
    }

    const blob = await response.blob();

    const downloadUrl = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = downloadUrl;
    link.download = "twitter-video.mp4";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(downloadUrl);

    status.textContent = "Download started!";

  } catch (error) {

    console.error(error);
    status.textContent = error.message || "Something went wrong.";

  } finally {

    button.disabled = false;

  }
});
</script>

</body>
</html>
